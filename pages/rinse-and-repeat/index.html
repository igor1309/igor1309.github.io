<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="og:site_name" content="Igor Malyarov"/><link rel="canonical" href="https://igor1309.dev/pages/rinse-and-repeat"/><meta name="twitter:url" content="https://igor1309.dev/pages/rinse-and-repeat"/><meta name="og:url" content="https://igor1309.dev/pages/rinse-and-repeat"/><title>Rinse and Repeat | Igor Malyarov</title><meta name="twitter:title" content="Rinse and Repeat | Igor Malyarov"/><meta name="og:title" content="Rinse and Repeat | Igor Malyarov"/><meta name="description" content="Notes from building software: products and architecture."/><meta name="twitter:description" content="Notes from building software: products and architecture."/><meta name="og:description" content="Notes from building software: products and architecture."/><meta name="twitter:card" content="summary"/><link rel="stylesheet" href="/styles.css?v=519d1fecaf" type="text/css"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><link rel="shortcut icon" href="/images/favicon_io/favicon.ico" type="image/x-icon"/><link rel="alternate" href="/feed.rss" type="application/rss+xml" title="Subscribe to Igor Malyarov"/><script>(function () {
  var root = document.documentElement;
  var order = ["system", "light", "dark"];
  function stored() {
    try { var t = localStorage.getItem("theme"); return t === "light" || t === "dark" ? t : "system"; }
    catch (e) { return "system"; }
  }
  function apply(theme) {
    if (theme === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", theme);
    pictures(theme);
  }
  // A <picture> dark source only knows the system setting; point it at the chosen theme.
  function pictures(theme) {
    var sources = document.querySelectorAll('picture source[media*="prefers-color-scheme: dark"], picture source[data-dark-media]');
    Array.prototype.forEach.call(sources, function (s) {
      if (!s.hasAttribute("data-dark-media")) s.setAttribute("data-dark-media", s.media);
      s.media = theme === "dark" ? "all" : theme === "light" ? "not all" : s.getAttribute("data-dark-media");
    });
  }
  apply(stored());
  var labels = {
    en: { name: { system: "system", light: "light", dark: "dark" }, text: function (c, n) { return "Theme: " + c + ". Switch to " + n; } },
    ru: { name: { system: "системная", light: "светлая", dark: "тёмная" }, next: { system: "системную", light: "светлую", dark: "тёмную" }, text: function (c, n) { return "Тема: " + c + ". Переключить на " + n; } }
  };
  function label(theme) {
    var l = (root.lang || "en").slice(0, 2) === "ru" ? labels.ru : labels.en;
    var next = order[(order.indexOf(theme) + 1) % order.length];
    return l.text(l.name[theme], (l.next || l.name)[next]);
  }
  function sync(button, theme) {
    button.setAttribute("data-choice", theme);
    button.setAttribute("aria-label", label(theme));
    button.setAttribute("title", label(theme));
  }
  document.addEventListener("DOMContentLoaded", function () {
    pictures(stored());
    var buttons = document.querySelectorAll(".theme-toggle");
    Array.prototype.forEach.call(buttons, function (button) {
      sync(button, stored());
      button.hidden = false;
      button.addEventListener("click", function () {
        var theme = order[(order.indexOf(stored()) + 1) % order.length];
        try {
          if (theme === "system") localStorage.removeItem("theme");
          else localStorage.setItem("theme", theme);
        } catch (e) {}
        apply(theme);
        Array.prototype.forEach.call(buttons, function (b) { sync(b, theme); });
      });
    });
  });
})();</script></head><body><header class="site-header"><div class="wrapper bar"><a href="/" class="brand"><span class="dot"></span>Igor Malyarov</a><nav><ul><li><a href="/articles">Articles</a></li><li><a href="/portfolio">Portfolio</a></li><li><a href="/about">About</a></li></ul><a href="/feed.rss" class="rss" aria-label="RSS feed"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg></a></nav><div class="prefs"><div class="lang-switch" role="group" aria-label="Language"><span aria-current="true" lang="en">EN</span><a href="/ru" hreflang="ru" lang="ru" aria-label="Читать по-русски" title="Читать по-русски">RU</a></div><button class="theme-toggle" type="button" hidden aria-label="Theme: system. Switch to light" title="Theme: system. Switch to light"><svg class="icon icon-monitor" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg><svg class="icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><svg class="icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button></div></div></header><main><div class="column
