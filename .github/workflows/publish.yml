# This is a reusable workflow that publishes the blog

name: Publish

on:
  workflow_call:
  
jobs:
  publish:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/Publish_build
            .build
          key: ${{ runner.os }}-${{ runner.arch }}-macos-26-xcode-26.3-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-macos-26-xcode-26.3-spm-
            
      - name: Setup JohnSundell/Publish
        run: |
          cd ${HOME}
          export PUBLISH_VERSION="0.9.0"
          git clone https://github.com/JohnSundell/Publish.git
          cd ./Publish && git checkout ${PUBLISH_VERSION}
          mv ~/Publish_build .build || true
          swift build -c release
          cp -r .build ~/Publish_build || true
          echo "${HOME}/Publish/.build/release" >> ${GITHUB_PATH}
          
      - name: Generate Site 
        run: publish-cli generate

      - name: Verify generated resource paths
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          resources = list(Path("Resources").rglob("*"))
          files = [source for source in resources if source.is_file()]
          assert files, "No source resources found"
          for source in files:
              target = Path("Output") / source.relative_to("Resources")
              assert target.is_file(), f"Missing generated resource: {target}"
              assert source.read_bytes() == target.read_bytes(), f"Changed resource: {target}"
          print(f"Verified {len(files)} generated resources at their original paths")
          PYTHON

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: published
          publish_dir: ./Output
          cname: igor1309.dev
